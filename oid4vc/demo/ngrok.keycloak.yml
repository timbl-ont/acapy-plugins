# ngrok tunnels for the demo with Keycloak as the authorization server
# (docker-compose.keycloak.yaml). Wallets reach Keycloak's token endpoint
# through the "keycloak" tunnel.
version: 3
tunnels:
  issuer:
    proto: http
    addr: issuer:8082
    # domain: your-custom-domain
  authserver:
    proto: http
    addr: auth-server:9001
    # domain: your-custom-domain
  demo:
    proto: http
    addr: demo-app:3000
    # domain: your-custom-domain
  keycloak:
    proto: http
    addr: keycloak:8080
    # domain: your-custom-domain
